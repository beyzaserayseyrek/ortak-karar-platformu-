<form method="post" action="/topic/{{ tid if tid is defined else t.id }}/message"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Katkı türü<select name="kind">{% for key,label in [('question','Öğrenme sorusu'),('explanation','Gerekçeli akran açıklaması'),('resource','Kaynak paylaşımı'),('counter','Karşı gerekçe')] %}<option value="{{ key }}" {% if request.form.get('kind')==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Katkın<textarea name="body" minlength="10" maxlength="4000" rows="4" required>{{ request.form.get('body','') }}</textarea></label><label>Kaynak bağlantısı (kaynak paylaşımında gerekli)<input name="url" type="url" value="{{ request.form.get('url','') }}" placeholder="https://..."></label><label>Yanıtlanan katkı numarası (isteğe bağlı)<input name="reply_to" type="number" min="1" value="{{ request.form.get('reply_to','') }}"></label><button>Katkıyı paylaş</button></form>
