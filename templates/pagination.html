<nav class="pager" aria-label="Sayfalama">{% if page>1 %}<a href="?page={{ page-1 }}&q={{ request.args.get('q','')|urlencode }}&group={{ request.args.get('group','')|urlencode }}&status={{ request.args.get('status','')|urlencode }}">Önceki</a>{% endif %}<span>Sayfa {{ page }}</span>{% if more %}<a href="?page={{ page+1 }}&q={{ request.args.get('q','')|urlencode }}&group={{ request.args.get('group','')|urlencode }}&status={{ request.args.get('status','')|urlencode }}">Sonraki</a>{% endif %}</nav>
